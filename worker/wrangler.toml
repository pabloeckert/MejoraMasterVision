name = "mastervision-worker"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Origen permitido para CORS. Reemplazá por tu URL real de GitHub Pages,
# ej: "https://pabloeckert.github.io"
[vars]
ALLOWED_ORIGIN = "*"
MODEL = "claude-sonnet-5"

# Namespace de KV para memoria (negocio / familia / general).
# Crealo con: wrangler kv namespace create MEMORY_KV
# y pegá el id que te devuelve acá abajo.
kv_namespaces = [
  { binding = "MEMORY_KV", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]
